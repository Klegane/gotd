ount":0,"alternatenamescount":12,"primaryname":{"nameid":"966174","name":"7 Wonders Duel","sortindex":"1","primaryname":"1","translit":"7 Wonders Duel"},"alternatenames":[{"nameid":"1214978","name":"7 Csoda P\u00e1rbaj"},{"nameid":"1018914","name":"7 Cud\u00f3w \u015awiata: Pojedynek"},{"nameid":"1200526","name":"7 Div\u016f sv\u011bta: Duel"},{"nameid":"1209878","name":"7 \u0427\u0443\u0434\u0435\u0441: \u0414\u0443\u044d\u043b\u044c"},{"nameid":"1741603","name":"7 \u0e2a\u0e34\u0e48\u0e07\u0e21\u0e2b\u0e31\u0e28\u0e08\u0e23\u0e23\u0e22\u0e4c \u0e14\u0e27\u0e25"},{"nameid":"1149477","name":"7 \uc6d0\ub354\uc2a4 \ub300\uacb0"},{"nameid":"2396280","name":"\u0644\u0639\u0628\u0629 \u0645\u0628\u0627\u0631\u0632\u0629 \u0627\u0644\u0639\u062c\u0627\u0626\u0628 \u0627\u0644\u0633\u0628\u0639\u0629"},{"nameid":"1349732","name":"\u4e03\u5927\u5947\u8e5f \u5c0d\u6c7a"},{"nameid":"1189209","name":"\u4e03\u5927\u5947\u8ff9:\u5bf9\u51b3"},{"nameid":"1966738","name":"\u4e03\u5927\u5947\u8ff9\uff1a\u5bf9\u51b3"},{"nameid":"1189214","name":"\u4e03\u5927\u5bf9\u51b3"},{"nameid":"1276372","name":"\u4e16\u754c\u306e\u4e03\u4e0d\u601d\u8b70:\u30c7\u30e5\u30a8\u30eb"}],"description":"<p>In many ways 7 Wonders Duel resembles its parent game 7 Wonders. Over three ages, players acquire cards that provide resources or advance their military or scientific development in order to develop a civilization and complete wonders. What's different about 7 Wonders Duel is that, as the title suggests, the game is solely for two players.<\/p>\n\n<p>Players do not draft cards simultaneously from decks of cards, but from a display of face-down and face-up cards arranged at the start of a round. A player can take a card only if it's not covered by any others, so timing comes into play, as it can with bonus moves that allow the player to take a second card immediately. As in the original game, each acquired card can be built, discarded for coins, or used to construct a wonder. Each player also starts with four wonder cards, and the construction of a wonder provides its owner with a special ability. Only seven wonders can be built, though, so one player will end up short.<\/p>\n\n<p>Players can purchase resources at any time from the bank, or they can gain cards during the game that provide them with resources for future building; as they are acquired, the cost for those resources increases for the opponent, representing the owner's dominance in this area.<\/p>\n\n<p>You can win 7 Wonders Duel in one of three ways: each time you acquire a military card, you advance the military marker toward your opponent's capital (also giving you a bonus at certain positions). If you reach the opponent's capital, you win the game immediately. Or if you acquire six of seven different scientific symbols, you achieve scientific dominance and win immediately. If none of these situations occurs, then the player with the most points at the end of the game wins.<\/p>\n\n","wiki":"<p><strong>Components<\/strong><\/p>\n\n<ul>\n    <li>1 game board<\/li>\n    <li>23 Age I cards<\/li>\n    <li>23 Age II cards<\/li>\n    <li>20 Age III cards<\/li>\n    <li>7 Guild cards<\/li>\n    <li>12 Wonder cards<\/li>\n    <li>4 Military tokens<\/li>\n    <li>10 Progress tokens<\/li>\n    <li>1 Conflict pawn<\/li>\n    <li>31 coins<\/li>\n    <li>Scorebook<\/li>\n    <li>Rule book<\/li>\n    <li>Help sheet<\/li>\n<\/ul>\n\n<p><a rel=\"nofollow\" href=\"https:\/\/www.rprod.com\/en\/7-wonders-duel\/faq\" onclick=\"window.open(this.href, '_blank'); return false;\">https:\/\/www.rprod.com\/en\/7-wonders-duel\/faq<\/a><\/p>\n\n<p><strong>Rules corrections<\/strong><\/p>\n\n<p>About the yellow buildings: <em>&quot;Starting on the following turn, you will purchase the indicated resource from the bank at the cost of 1 coin per unit&quot;<\/em> means exactly what it says. Your payment does not depend on any buildings your opponent might own.<\/p>\n\n<p>The following change should be made to the rules for determining first player for Age II and Age III:<\/p>\n\n<ul>\n    <li> From page 11 of the rulebook (additional text bold and italicized):<\/li>\n<\/ul>\n\n<p>The player with the weakest military chooses which player begins the next Age.<br \/>\nA player has a weaker military if the Conflict pawn is on their side of the board.<br \/>\nIn a situation where the pawn is in the middle of the board, the player who <em><strong>chooses which player<\/strong><\/em> begins the next Age is the last active player (meaning whoever played the last card of the previous Age).<\/p>\n\n<p>Source: <a  href=\"\/thread\/1564734\/start-age-ii-and-iii-rule-in-helpsheet-differs-fro\"   >Start Age II and III: rule in helpsheet differs from rule in rulebook<\/a><\/p>\n\n<strong><a class=\"\" href=\"\/wiki\/page\/On-line_games#\">Online Play<\/a><\/strong><br \/>\n<ul>\n    <li> <a rel=\"nofollow\" href=\"http:\/\/sevenee.mattle.online\" onclick=\"window.open(this.href, '_blank'); return false;\">sevenee.mattle.online<\/a> (real-time)<\/li>\n<\/ul>\n\n<p><strong><a class=\"\" href=\"\/wiki\/page\/Microbadge#\">Microbadge<\/a><\/strong><\/p>\n\n<p><a href=\"\/microbadge\/35873\"><img alt='Microbadge: 7 Wonders Duel fan' onmouseover=\"return overlib('7 Wonders Duel fan', WRAP );\" onmouseout=\"return nd();\" title=''class='mbimg'loading=\"lazy\"src=\"https:\/\/cf.geekdo-static.com\/mbs\/mb_35873_0.png\"><\/a> <a href=\"\/microbadge\/39086\"><img alt='Microbadge: 7 Wonders Duel fan - Science' onmouseover=\"return overlib('7 Wonders Duel fan - Science', WRAP );\" onmouseout=\"return nd();\" title=''class='mbimg'loading=\"lazy\"src=\"https:\/\/cf.geekdo-static.com\/mbs\/mb_39086_0.png\"><\/a> <a href=\"\/microbadge\/39085\"><img alt='Microbadge: 7 Wonders Duel fan - Military' onmouseover=\"return overlib('7 Wonders Duel fan - Military', WRAP );\" onmouseout=\"return nd();\" title=''class='mbimg'loading=\"lazy\"src=\"https:\/\/cf.geekdo-static.com\/mbs\/mb_39085_0.png\"><\/a> &mdash; <em>7 Wonders: Duel<\/em> fan<\/p>\n\n","website":{"url":"https:\/\/www.rprod.com\/en\/games\/7-wonders-duel","title":"7 Wonders Duel - Main Page"},"imageid":"2576399","images":{"thumb":"https:\/\/cf.geekdo-images.com\/zdagMskTF7wJBPjX74XsRw__small\/img\/gV1-ckZSIC-dCxxpq1Y7GmPITzQ=\/fit-in\/200x150\/filters:strip_icc()\/pic2576399.jpg","micro":"https:\/\/cf.geekdo-images.com\/zdagMskTF7wJBPjX74XsRw__micro\/img\/nXtpcw3tYaelntFHb1aH4YrN7Wk=\/fit-in\/64x64\/filters:strip_icc()\/pic2576399.jpg","square":"https:\/\/cf.geekdo-images.com\/zdagMskTF7wJBPjX74XsRw__square\/img\/U5LzI7WMQ1ybcJPU8nRuxQkjt18=\/75x75\/filters:strip_icc()\/pic2576399.jpg","tallthumb":"https:\/\/cf.geekdo-images.com\/zdagMskTF7wJBPjX74XsRw__tallthumb\/img\/Z_zGTN76b23-FBfg0c7b1tItpMU=\/fit-in\/75x125\/filters:strip_icc()\/pic2576399.jpg","previewthumb":"https:\/\/cf.geekdo-images.com\/zdagMskTF7wJBPjX74XsRw__previewthumb\/img\/q9aKi0ZYFY2LKJWeWHG96JDq6Pg=\/fit-in\/300x320\/filters:strip_icc()\/pic2576399.jpg","square200":"https:\/\/cf.geekdo-images.com\/zdagMskTF7wJBPjX74XsRw__square200\/img\/xNee3M-jWc5u5sMjn7IyvWFJ4qQ=\/200x200\/filters:strip_icc()\/pic2576399.jpg","original":"https:\/\/cf.geekdo-images.com\/zdagMskTF7wJBPjX74XsRw__original\/img\/Ju836WNSaW7Mab9Vjq2TJ_FqhWQ=\/0x0\/filters:format(jpeg)\/pic2576399.jpg"},"imagepagehref":"\/image\/2576399\/7-wonders-duel","imageurl":"https:\/\/cf.geekdo-images.com\/zdagMskTF7wJBPjX74XsRw__itemrep\/img\/x5L93n_pSsxfFZ0Ir-JqtjLf-Jw=\/fit-in\/246x300\/filters:strip_icc()\/pic2576399.jpg","imageurl@2x":"https:\/\/cf.geekdo-images.com\/zdagMskTF7wJBPjX74XsRw__itemrep@2x\/img\/MfMm8FX7KX0xxieQowGXpPfJlh4=\/fit-in\/492x600\/filters:strip_icc()\/pic2576399.jpg","topimageurl":"https:\/\/cf.geekdo-images.com\/PMh6Ov_3gLJBnXnAb-yZKA__itemheader\/img\/kgDNdMOoCE0QBNkJDKs1aoGfAt4=\/800x450\/filters:quality(30):strip_icc()\/pic2558121.jpg","imageSets":{"square100":{"src":"https:\/\/cf.geekdo-images.com\/zdagMskTF7wJBPjX74XsRw__square100\/img\/A609RxSanxnR5rSxV0tYnD-KVZ8=\/100x100
