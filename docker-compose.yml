services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: file:/data/app.db
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      # Liveness only: /api/health does not touch the database, so this poll
      # never keeps a serverless database awake.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-data:
